[pytest]
addopts = -vs

log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(levelname)s %(filename)-20s %(funcName)-20s %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

log_cli = True
log_cli_level = info
#-20:预留多少字符，控制日志输出的对齐
log_cli_format = %(asctime)s %(levelname)s %(filename)-20s %(funcName)-20s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
